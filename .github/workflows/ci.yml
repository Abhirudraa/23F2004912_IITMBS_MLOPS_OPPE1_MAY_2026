name: OPPE CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Authenticate to Google Cloud (OIDC + WIF)
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # Install gcloud
      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Export credentials for DVC
      - name: Export ADC Credentials
        run: |
          echo "GOOGLE_APPLICATION_CREDENTIALS=${{ steps.auth.outputs.credentials_file_path }}" >> $GITHUB_ENV

      # Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Pull versioned data from DVC
      - name: Pull DVC Data
        run: |
          dvc pull

      # Load best registered model
      - name: Fetch Best Model from MLflow
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          python - <<EOF
          import mlflow

          model = mlflow.pyfunc.load_model("models:/stock_rf/latest")

          print("Successfully loaded registered model.")
          EOF

      # Feature sanity tests
      - name: Run Feature Tests
        run: |
          pytest tests/test_features.py

      # Evaluate model
      - name: Evaluate Model
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          python scripts/evaluate.py

      # Install official CML
      - name: Setup CML
        if: github.event_name == 'pull_request'
        uses: iterative/setup-cml@v2

      # Generate report
      - name: Generate CML Report
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "# OPPE-1 Evaluation Report" > report.md
          echo "" >> report.md

          echo "## Evaluation Metrics" >> report.md
          cat metrics.txt >> report.md

          echo "" >> report.md
          echo "## Feature Sanity Tests" >> report.md
          echo "- ✅ rolling_avg_10 passed" >> report.md
          echo "- ✅ volume_sum_10 passed" >> report.md

          cml comment create report.md
