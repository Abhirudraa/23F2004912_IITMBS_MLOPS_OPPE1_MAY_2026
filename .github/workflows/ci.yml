name: OPPE CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  evaluate:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # -------------------------
      # Authenticate to GCP (WIF)
      # -------------------------
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Export ADC
        run: |
          echo "GOOGLE_APPLICATION_CREDENTIALS=${{ steps.auth.outputs.credentials_file_path }}" >> $GITHUB_ENV

      # -------------------------
      # Install dependencies
      # -------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "dvc[gs]"
          pip install pytest
          pip install mlflow
          pip install cml

      # -------------------------
      # Pull DVC snapshot
      # -------------------------
      - name: Pull DVC Data
        run: |
          dvc pull

      # -------------------------
      # Fetch best model
      # -------------------------
      - name: Fetch Best MLflow Model
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          python - <<EOF
          import mlflow

          model = mlflow.pyfunc.load_model("models:/stock_rf/latest")

          print("Successfully loaded registered model.")
          EOF

      # -------------------------
      # Feature sanity tests
      # -------------------------
      - name: Feature Tests
        run: |
          pytest tests/test_features.py

      # -------------------------
      # Evaluate
      # -------------------------
      - name: Evaluate Model
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          python scripts/evaluate.py

      # -------------------------
      # Setup CML
      # -------------------------
      - name: Setup CML
        if: github.event_name == 'pull_request'
        uses: iterative/setup-cml@v2

      # -------------------------
      # Generate report
      # -------------------------
      - name: Generate CML Report
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          echo "# Stock Movement Predictor" > report.md

          echo "" >> report.md

          echo "## Evaluation Metrics" >> report.md

          cat metrics.txt >> report.md

          echo "" >> report.md

          echo "## Feature Sanity Tests" >> report.md

          echo "✅ rolling_avg_10 passed" >> report.md
          echo "✅ volume_sum_10 passed" >> report.md

          cml comment create report.md
