name: OPPE CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      ####################################################
      # Checkout
      ####################################################
      - name: Checkout Repository
        uses: actions/checkout@v4

      ####################################################
      # Python
      ####################################################
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      ####################################################
      # Google Cloud Authentication (OIDC + WIF)
      ####################################################
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Export ADC Credentials
        run: |
          echo "GOOGLE_APPLICATION_CREDENTIALS=${{ steps.auth.outputs.credentials_file_path }}" >> $GITHUB_ENV

      ####################################################
      # Install Dependencies
      ####################################################
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      ####################################################
      # Pull DVC Data
      ####################################################
      - name: Pull DVC Data
        run: |
          dvc pull

      ####################################################
      # Verify MLflow Registry
      ####################################################
      - name: Check MLflow Registry
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          python - <<EOF
          import mlflow

          print("Tracking URI:", mlflow.get_tracking_uri())

          client = mlflow.MlflowClient()

          print("\nRegistered Models")
          print("-----------------")

          models = client.search_registered_models()

          for m in models:
              print(m.name)

          print("\nLoading latest model...\n")

          model = mlflow.pyfunc.load_model("models:/stock_rf_fixed/latest")
          print("Loaded registered model successfully.")

          print("SUCCESS : Registered model loaded.")
          EOF

      ####################################################
      # Feature Sanity Tests
      ####################################################
      - name: Run Feature Tests
        run: |
          pytest tests/test_features.py

      ####################################################
      # Evaluate
      ####################################################
      - name: Evaluate Model
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          python scripts/evaluate.py

      ####################################################
      # Install Official CML
      ####################################################
      - name: Setup CML
        if: github.event_name == 'pull_request'
        uses: iterative/setup-cml@v2

      ####################################################
      # Create Report
      ####################################################
      - name: Generate CML Report
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "# OPPE-1 CI Report" > report.md
          echo "" >> report.md

          echo "## MLflow" >> report.md
          echo "✅ Loaded latest registered model (**stock_rf**)." >> report.md
          echo "" >> report.md

          echo "## Evaluation Metrics" >> report.md
          cat metrics.txt >> report.md

          echo "" >> report.md

          echo "## Feature Sanity Tests" >> report.md
          echo "- ✅ rolling_avg_10" >> report.md
          echo "- ✅ volume_sum_10" >> report.md

          cml comment create report.md
